name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: renobot-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref_name }}
          SELECTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$SELECTED_REF_TYPE" != "branch" || "$SELECTED_REF" != "$DEFAULT_BRANCH" ]]; then
            printf 'Production deployments require the default branch (%s); selected %s %s.\n' \
              "$DEFAULT_BRANCH" "$SELECTED_REF_TYPE" "$SELECTED_REF" >&2
            exit 1
          fi

  validate:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations and run SQLite integration tests
        run: npm run db:test

  publish:
    needs: [validate, database]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "${DEPLOY_PORT:-22}" > ~/.ssh/config
      - name: Upload deployment definition
        run: |
          scp deploy/compose.yaml deploy/deploy.sh production:/opt/renobot/
          ssh production chmod 755 /opt/renobot/deploy.sh
      - name: Deploy image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          KOFI_TEST_MODE_VARIABLE: ${{ vars.KOFI_TEST_MODE }}
          KOFI_TEST_MODE_SECRET: ${{ secrets.KOFI_TEST_MODE }}
          KOFI_ENCRYPTION_KEY: ${{ secrets.KOFI_ENCRYPTION_KEY }}
        run: |
          if [[ -n "$KOFI_TEST_MODE_VARIABLE" && -n "$KOFI_TEST_MODE_SECRET"
            && "$KOFI_TEST_MODE_VARIABLE" != "$KOFI_TEST_MODE_SECRET" ]]; then
            echo 'Conflicting KOFI_TEST_MODE environment variable and secret.' >&2
            exit 2
          fi
          mode=${KOFI_TEST_MODE_VARIABLE:-${KOFI_TEST_MODE_SECRET:-false}}
          if [[ "$mode" != true && "$mode" != false ]]; then
            echo 'KOFI_TEST_MODE must be true or false.' >&2
            exit 2
          fi
          if [[ -n "$KOFI_TEST_MODE_VARIABLE" ]]; then
            echo 'Ko-fi test mode source: production environment variable.'
          elif [[ -n "$KOFI_TEST_MODE_SECRET" ]]; then
            echo 'Ko-fi test mode source: production environment secret.'
          else
            echo 'Ko-fi test mode is not configured; defaulting to false.'
          fi
          if [[ -z "$KOFI_ENCRYPTION_KEY" ]]; then
            echo 'The production KOFI_ENCRYPTION_KEY environment secret is required.' >&2
            exit 2
          fi
          printf '%s\n' "$KOFI_ENCRYPTION_KEY" | ssh production /opt/renobot/deploy.sh "$IMAGE" "$mode"