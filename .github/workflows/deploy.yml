name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: renobot-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref_name }}
          SELECTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$SELECTED_REF_TYPE" != "branch" || "$SELECTED_REF" != "$DEFAULT_BRANCH" ]]; then
            printf 'Production deployments require the default branch (%s); selected %s %s.\n' \
              "$DEFAULT_BRANCH" "$SELECTED_REF_TYPE" "$SELECTED_REF" >&2
            exit 1
          fi

  validate:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations and run SQLite integration tests
        run: npm run db:test

  build-images:
    needs: [validate, database]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=gha,scope=renobot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=renobot-${{ matrix.arch }}

  publish:
    needs: build-images
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: merge
        name: Publish multiarchitecture manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BUILD_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:${{ github.sha }}" \
            "$IMAGE:$BUILD_TAG-amd64" "$IMAGE:$BUILD_TAG-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "${DEPLOY_PORT:-22}" > ~/.ssh/config
      - name: Upload deployment definition
        run: |
          scp deploy/compose.yaml deploy/deploy.sh production:/opt/renobot/
          ssh production chmod 755 /opt/renobot/deploy.sh
      - name: Deploy image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          KOFI_ENCRYPTION_KEY: ${{ secrets.KOFI_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [[ -z "$KOFI_ENCRYPTION_KEY" ]]; then
            echo 'The production KOFI_ENCRYPTION_KEY environment secret is required.' >&2
            exit 2
          fi
          if [[ -z "$SMTP_PASSWORD" ]]; then
            echo 'The production SMTP_PASSWORD environment secret is required.' >&2
            exit 2
          fi
          printf '%s\n%s\n' "$KOFI_ENCRYPTION_KEY" "$SMTP_PASSWORD" | ssh production /opt/renobot/deploy.sh "$IMAGE"