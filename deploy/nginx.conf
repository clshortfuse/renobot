limit_req_zone $binary_remote_addr zone=renobot_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=renobot_oauth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=renobot_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name renobot.renodx.com;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_conn renobot_connections 20;

    # Static files contain no credentials or authorization decisions.
    root /opt/renobot/public;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /home.html =503;
        expires -1;
    }

    location = /app {
        try_files /app.html =503;
        expires -1;
    }

    location = /app/modder/kofi {
        try_files /modder-kofi.html =503;
        expires -1;
    }

    location = /assets/site.css {
        try_files /site.css =404;
        expires 1m;
    }

    location = /assets/site.js {
        try_files /site.js =404;
        expires 1m;
    }

    location = /health {
        deny all;
    }

    location ^~ /auth/discord {
        limit_req zone=renobot_oauth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    # Overwrite client-supplied provenance; the app does not use X-Forwarded-For.
    location ^~ /prod/kofi/ {
        limit_req zone=renobot_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Renobot-Client-IP $remote_addr;
        proxy_set_header X-Renobot-Client-Port $remote_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=renobot_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}